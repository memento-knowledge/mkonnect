name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to validate
        required: true
        type: string
      publish:
        description: Publish release artifacts (push-tag runs only)
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_commit: ${{ steps.metadata.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: metadata
        name: Fetch release tag and main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          bash scripts/release-metadata.sh \
            --repo . \
            --tag "$RELEASE_TAG" \
            --main-ref origin/main \
            --output "$GITHUB_OUTPUT"
