name: Release

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.metadata.outputs.release_id }}
      chart_version: ${{ steps.metadata.outputs.chart_version }}
      release_commit: ${{ steps.metadata.outputs.release_commit }}
      asset_name: ${{ steps.asset.outputs.asset_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: metadata
        name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          git fetch --force --tags origin
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG^{commit}"
          bash scripts/release-metadata.sh --repo . --tag "$RELEASE_TAG" --main-ref origin/main --output "$GITHUB_OUTPUT"

      - name: Run release metadata tests
        run: bash scripts/release-metadata_test.sh

      - name: Run ECR Public lookup tests
        run: bash scripts/ecr-public-image-digest_test.sh

      - name: Run image tag reconcile tests
        run: bash scripts/reconcile-image-tags_test.sh

      - name: Run release-metadata.json tests
        run: bash scripts/validate-release-metadata_test.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test ./... -v -race

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Run release chart source tests
        run: bash scripts/release-chart-source_test.sh

      - name: Run release asset bundle tests
        run: bash scripts/release-asset-bundle_test.sh

      - name: Lint and package chart
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
        run: |
          helm lint charts/mkonnect
          helm package charts/mkonnect --destination dist
          cd dist
          sha256sum "mkonnect-$CHART_VERSION.tgz" > "mkonnect-$CHART_VERSION.tgz.sha256"
          cd ..
          bash scripts/release-chart-source.sh --chart-dir charts/mkonnect --package "dist/mkonnect-$CHART_VERSION.tgz"

      - id: asset
        name: Name release asset bundle
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.release_commit }}
        run: printf 'asset_name=release-assets-%s-%s\n' "$RELEASE_ID" "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  # The git-sync image is published on a best-effort basis. A failure here (including a failed
  # build) must never block the connector image, the chart, or the GitHub Release, so the job is
  # marked continue-on-error and the publish job reads its outputs only when it succeeded. Tags
  # are pushed only after a successful build; see scripts/reconcile-image-tags.sh.
  publish-gitsync:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.reconcile.outputs.image }}
      image_digest: ${{ steps.reconcile.outputs.image_digest }}
    env:
      RELEASE_ID: ${{ needs.verify.outputs.release_id }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
      ECR_PUBLIC_ALIAS: ${{ vars.ECR_PUBLIC_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate registry configuration
        run: |
          if [ -z "$ECR_PUBLIC_ALIAS" ]; then
            echo "ECR_PUBLIC_ALIAS repository variable is required" >&2
            exit 1
          fi

      - name: Log in to Docker registry
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - id: reconcile
        name: Reconcile git-sync image tags
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/gitsync-image.env"
          bash scripts/reconcile-image-tags.sh \
            --registry "$ECR_REGISTRY/$ECR_PUBLIC_ALIAS" \
            --repository memento-gitsync \
            --dockerfile Dockerfile.gitsync \
            --release-id "$RELEASE_ID" \
            --release-commit "$RELEASE_COMMIT" \
            --output "$result"
          cat "$result" >> "$GITHUB_OUTPUT"

      - name: Report that the git-sync image was not published
        if: failure()
        run: echo "::warning::The git-sync image was not published for release $RELEASE_ID. The connector image, chart, and GitHub Release are not affected."

  publish:
    # Run even when the optional git-sync job failed, but not after a cancellation.
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' }}
    needs: [verify, publish-gitsync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_ID: ${{ needs.verify.outputs.release_id }}
      CHART_VERSION: ${{ needs.verify.outputs.chart_version }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
      ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ECR_PUBLIC_ALIAS: ${{ vars.ECR_PUBLIC_ALIAS }}
      GIT_SYNC_RESULT: ${{ needs.publish-gitsync.result }}
      GIT_SYNC_OUTPUT_IMAGE: ${{ needs.publish-gitsync.outputs.image }}
      GIT_SYNC_OUTPUT_DIGEST: ${{ needs.publish-gitsync.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The git-sync image counts as published only when its job succeeded and reported a digest.
      # GIT_SYNC_IMAGE and GIT_SYNC_IMAGE_DIGEST stay unset otherwise, and nothing about the
      # connector release depends on them.
      - name: Resolve git-sync image publication
        run: |
          set -euo pipefail
          if [ "$GIT_SYNC_RESULT" = success ] && [[ $GIT_SYNC_OUTPUT_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] && [ -n "$GIT_SYNC_OUTPUT_IMAGE" ]; then
            printf 'GIT_SYNC_IMAGE=%s\nGIT_SYNC_IMAGE_DIGEST=%s\n' "$GIT_SYNC_OUTPUT_IMAGE" "$GIT_SYNC_OUTPUT_DIGEST" >> "$GITHUB_ENV"
            echo "git-sync image published: $GIT_SYNC_OUTPUT_IMAGE@$GIT_SYNC_OUTPUT_DIGEST"
          else
            echo "::warning::The git-sync image was not published for release $RELEASE_ID (job result: $GIT_SYNC_RESULT). Continuing without it."
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist

      - name: Verify uploaded chart bundle
        run: |
          cd dist
          sha256sum -c "mkonnect-$CHART_VERSION.tgz.sha256"

      - name: Create or reconcile draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="mkonnect-$CHART_VERSION.tgz"
          checksum="$package.sha256"
          release_json=$(mktemp)
          if gh release view "$RELEASE_TAG" --json isDraft,assets,body >"$release_json" 2>/dev/null; then
            if [ "$(jq -r '.isDraft' "$release_json")" != true ]; then
              echo "release $RELEASE_TAG is already published" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "mkonnect $RELEASE_ID"
            gh release view "$RELEASE_TAG" --json isDraft,assets,body >"$release_json"
          fi

          has_asset() {
            jq -e --arg name "$1" '.assets | any(.name == $name)' "$release_json" >/dev/null
          }

          chart_present=false
          checksum_present=false
          if has_asset "$package"; then chart_present=true; fi
          if has_asset "$checksum"; then checksum_present=true; fi
          canonical="$RUNNER_TEMP/release-assets-$RELEASE_ID"
          rm -rf "$canonical"
          mkdir -p "$canonical"
          trap 'rm -f "$release_json"' EXIT

          if "$chart_present"; then
            gh release download "$RELEASE_TAG" --pattern "$package" --dir "$canonical"
          fi
          if "$checksum_present"; then
            gh release download "$RELEASE_TAG" --pattern "$checksum" --dir "$canonical"
          fi

          bundle_output="$RUNNER_TEMP/release-asset-bundle-$RELEASE_ID.env"
          bash scripts/release-asset-bundle.sh \
            --chart-dir charts/mkonnect \
            --source-package "dist/$package" \
            --asset-dir "$canonical" \
            --output "$bundle_output"
          # shellcheck disable=SC1090
          source "$bundle_output"
          if "$chart_upload"; then
            gh release upload "$RELEASE_TAG" "$canonical/$package"
          fi
          if "$checksum_upload"; then
            gh release upload "$RELEASE_TAG" "$canonical/$checksum"
          fi

          printf 'CANONICAL_DIR=%s\n' "$canonical" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate registry configuration
        run: |
          if [ -z "$ECR_PUBLIC_ALIAS" ]; then
            echo "ECR_PUBLIC_ALIAS repository variable is required" >&2
            exit 1
          fi

      - name: Log in to Docker registry
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Log in to Helm registry
        run: aws ecr-public get-login-password --region us-east-1 | helm registry login --username AWS --password-stdin public.ecr.aws

      - name: Reconcile release image tags
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/connector-image.env"
          bash scripts/reconcile-image-tags.sh \
            --registry "$ECR_REGISTRY/$ECR_PUBLIC_ALIAS" \
            --repository memento-connector \
            --dockerfile Dockerfile \
            --release-id "$RELEASE_ID" \
            --release-commit "$RELEASE_COMMIT" \
            --output "$result"
          # shellcheck disable=SC1090
          source "$result"
          printf 'IMAGE_DIGEST=%s\nIMAGE=%s\n' "$image_digest" "$image" >> "$GITHUB_ENV"

      - name: Reconcile Helm chart
        run: |
          set -euo pipefail
          package="mkonnect-$CHART_VERSION.tgz"
          checksum="$package.sha256"
          chart_uri="oci://$ECR_REGISTRY/$ECR_PUBLIC_ALIAS/mkonnect"

          chart_digest() {
            bash scripts/ecr-public-image-digest.sh --repository mkonnect --tag "$CHART_VERSION"
          }

          if chart_digest >/dev/null; then
            chart_exists=true
          else
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            chart_exists=false
          fi
          if ! "$chart_exists"; then
            helm push "$CANONICAL_DIR/$package" "oci://$ECR_REGISTRY/$ECR_PUBLIC_ALIAS"
          else
            pulled=$(mktemp -d)
            trap 'rm -rf "$pulled"' EXIT
            helm pull "$chart_uri" --version "$CHART_VERSION" --destination "$pulled"
            expected=$(awk '{ print $1 }' "$CANONICAL_DIR/$checksum")
            actual=$(sha256sum "$pulled/$package" | awk '{ print $1 }')
            [ "$actual" = "$expected" ]
          fi

          final_digest=$(chart_digest)
          [ -n "$final_digest" ]
          printf 'CHART_DIGEST=%s\nCHART_URI=%s\n' "$final_digest" "$chart_uri" >> "$GITHUB_ENV"

      # Both image digests and the chart version are known only now, so the metadata file is
      # generated here rather than in the verify job. An existing asset is never overwritten:
      # it must be byte-identical to the regenerated file.
      - name: Create or reconcile release-metadata.json asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=release-metadata.json
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/generated" "$work/existing"

          args=(
            --release-id "$RELEASE_ID"
            --chart-version "$CHART_VERSION"
            --connector-image-digest "$IMAGE_DIGEST"
            --output "$work/generated/$asset"
          )
          if [ -n "${GIT_SYNC_IMAGE_DIGEST-}" ]; then
            args+=(--git-sync-image-digest "$GIT_SYNC_IMAGE_DIGEST")
          fi
          bash scripts/release-metadata-json.sh "${args[@]}"
          bash scripts/validate-release-metadata.sh "$work/generated/$asset"

          asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -Fxq "$asset" <<<"$asset_names"; then
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$work/existing"
            if ! cmp -s "$work/existing/$asset" "$work/generated/$asset"; then
              echo "release asset $asset differs from the metadata regenerated for this run; refusing to overwrite it" >&2
              diff -u "$work/existing/$asset" "$work/generated/$asset" >&2 || true
              exit 1
            fi
          else
            gh release upload "$RELEASE_TAG" "$work/generated/$asset"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="mkonnect-$CHART_VERSION.tgz"
          checksum="$package.sha256"
          metadata=release-metadata.json
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --pattern "$package" --pattern "$checksum" --pattern "$metadata" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c "$checksum")
          bash scripts/validate-release-metadata.sh "$verify_dir/$metadata"

          generated_notes=$(mktemp)
          gh release view "$RELEASE_TAG" --json body --jq .body >"$generated_notes"
          notes=$(mktemp)
          chart_sha=$(awk '{ print $1 }' "$CANONICAL_DIR/$checksum")
          {
            printf '%s\n\n' '## Artifacts'
            printf '%s\n' "- Container image: $IMAGE:$RELEASE_ID"
            printf '%s\n' "- Container image digest: $IMAGE_DIGEST"
            printf '%s\n' "- Commit image tag: $IMAGE:sha-$RELEASE_COMMIT"
            if [ -n "${GIT_SYNC_IMAGE_DIGEST-}" ]; then
              printf '%s\n' "- Git-sync container image: $GIT_SYNC_IMAGE:$RELEASE_ID"
              printf '%s\n' "- Git-sync container image digest: $GIT_SYNC_IMAGE_DIGEST"
              printf '%s\n' "- Git-sync commit image tag: $GIT_SYNC_IMAGE:sha-$RELEASE_COMMIT"
            else
              printf '%s\n' '- The git-sync image was not published for this release; the git-sync fields in release-metadata.json are null.'
            fi
            printf '%s\n' "- Helm chart: $CHART_URI:$CHART_VERSION"
            printf '%s\n' "- Helm chart digest: $CHART_DIGEST"
            printf '%s\n' "- Chart SHA-256: $chart_sha"
            printf '%s\n\n' "- Release metadata: $metadata (attached to this release)"
            printf '%s\n\n' 'Install the chart with:'
            printf '%s\n\n' "    helm install mkonnect $CHART_URI --version $CHART_VERSION -f mkonnect-secrets.yaml --set image.repository=$IMAGE"
            cat "$generated_notes"
          } >"$notes"
          gh release edit "$RELEASE_TAG" --draft=false --notes-file "$notes"
