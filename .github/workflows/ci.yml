name: CI

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test ./... -v -race

      - name: Run release metadata tests
        run: bash scripts/release-metadata_test.sh

      - name: Run ECR Public lookup tests
        run: bash scripts/ecr-public-image-digest_test.sh

      - name: Run image tag reconcile tests
        run: bash scripts/reconcile-image-tags_test.sh

      - name: Run release-metadata.json tests
        run: bash scripts/validate-release-metadata_test.sh

      - name: Run release-metadata.json reconcile tests
        run: bash scripts/reconcile-release-metadata_test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # staticcheck and govulncheck are version-pinned for reproducible lint runs and must be
      # able to analyze the Go toolchain above (go.mod directive `go 1.27.0`); an older pin can
      # fail on a newer toolchain's export-data format. Bump them in lockstep whenever the
      # setup-go version is raised.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Run release chart source tests
        run: bash scripts/release-chart-source_test.sh

      - name: Run release asset bundle tests
        run: bash scripts/release-asset-bundle_test.sh

      - name: Run chart CA-bundle render tests
        run: bash scripts/chart-ca-bundle_test.sh

      - name: Lint Helm chart
        run: helm lint charts/mkonnect

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build release image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$REVISION" \
            --tag mkonnect:ci \
            .

      - name: Verify image metadata and health command
        env:
          REVISION: ${{ github.sha }}
        run: |
          test "$(docker inspect mkonnect:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = ci
          test "$(docker inspect mkonnect:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$REVISION"
          docker run --rm mkonnect:ci --health

      - name: Verify a fresh /data volume is writable by the non-root user
        run: |
          docker volume create ci-data-check
          # Mounting the image initializes the empty volume from the image's /data
          # (ownership included); --health exits 0 immediately after that.
          docker run --rm -v ci-data-check:/data mkonnect:ci --health
          owner=$(docker run --rm -v ci-data-check:/data alpine stat -c %u /data)
          docker volume rm ci-data-check
          echo "fresh /data owner uid: $owner"
          test "$owner" = "65532"

  image-gitsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build git-sync image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile.gitsync \
            --build-arg VERSION=ci \
            --build-arg REVISION="$REVISION" \
            --tag mkonnect-gitsync:ci \
            .

      - name: Verify image metadata and health command
        env:
          REVISION: ${{ github.sha }}
        run: |
          test "$(docker inspect mkonnect-gitsync:ci --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')" = mkonnect-gitsync
          test "$(docker inspect mkonnect-gitsync:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = ci
          test "$(docker inspect mkonnect-gitsync:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$REVISION"
          test "$(docker inspect mkonnect-gitsync:ci --format '{{ .Config.User }}')" = 65532:65532
          test "$(docker inspect mkonnect-gitsync:ci --format '{{ len .Config.ExposedPorts }}')" = 0
          docker run --rm mkonnect-gitsync:ci --health

      - name: Verify the image ships git 2.31 or newer
        run: |
          version=$(docker run --rm --entrypoint git mkonnect-gitsync:ci --version | awk '{ print $3 }')
          echo "git version in image: $version"
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 31 ]; }; then
            echo "git >= 2.31 is required" >&2
            exit 1
          fi

      - name: Verify a fresh /data volume is writable by the non-root user
        run: |
          docker volume create ci-gitsync-data-check
          # Mounting the image initializes the empty volume from the image's /data
          # (ownership included); --health exits 0 immediately after that.
          docker run --rm -v ci-gitsync-data-check:/data mkonnect-gitsync:ci --health
          owner=$(docker run --rm -v ci-gitsync-data-check:/data alpine stat -c %u:%g /data)
          docker volume rm ci-gitsync-data-check
          echo "fresh /data owner uid:gid: $owner"
          test "$owner" = "65532:65532"

      - name: Smoke-test the operator CLI under a hardened runtime
        run: |
          docker volume create ci-gitsync-data
          docker volume create ci-gitsync-tmp
          # The read-only root filesystem and dropped capabilities match the recommended
          # deployment. git-sync creates its scratch directories under /tmp, so /tmp is a real
          # (disk-backed) volume here rather than the image's read-only layer.
          run_hardened() {
            docker run --rm --read-only --user 65532:65532 --cap-drop ALL \
              -v ci-gitsync-data:/data -v ci-gitsync-tmp:/tmp mkonnect-gitsync:ci "$@"
          }
          # The first mount of an empty named volume initializes it from the image's /data.
          docker run --rm -v ci-gitsync-data:/data mkonnect-gitsync:ci --health
          run_hardened connector config set ci-smoke --base-url https://source.example.invalid/
          listing=$(run_hardened connector config list)
          echo "$listing"
          echo "$listing" | grep -q 'ci-smoke'
          docker volume rm ci-gitsync-data ci-gitsync-tmp
