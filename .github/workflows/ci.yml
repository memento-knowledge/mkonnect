name: CI

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./... -v -race

      - name: Run release metadata tests
        run: bash scripts/release-metadata_test.sh

      - name: Run ECR Public lookup tests
        run: bash scripts/ecr-public-image-digest_test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # staticcheck and govulncheck are pinned to the releases built for the Go version
      # above (go.mod directive `go 1.25.0`). With GOTOOLCHAIN=local, `go run tool@ver`
      # refuses to build a tool that requires a newer Go than the toolchain, so these pins
      # must be bumped in lockstep whenever the setup-go version is raised.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Run release chart source tests
        run: bash scripts/release-chart-source_test.sh

      - name: Lint Helm chart
        run: helm lint charts/mkonnect

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build release image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$REVISION" \
            --tag mkonnect:ci \
            .

      - name: Verify image metadata and health command
        env:
          REVISION: ${{ github.sha }}
        run: |
          test "$(docker inspect mkonnect:ci --format '{{ index .Config.Labels \"org.opencontainers.image.version\" }}')" = ci
          test "$(docker inspect mkonnect:ci --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}')" = "$REVISION"
          docker run --rm mkonnect:ci --health
