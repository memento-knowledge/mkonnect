{{- if include "mkonnect.gitsync.enabled" . -}}
{{- $gs := include "mkonnect.gitsync.values" . | fromYaml -}}
{{- if $gs.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mkonnect.gitsync.serviceAccountName" . }}
  labels:
    {{- include "mkonnect.gitsync.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
