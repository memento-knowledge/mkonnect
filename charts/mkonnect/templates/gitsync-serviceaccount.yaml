{{- if and .Values.gitSync.enabled .Values.gitSync.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mkonnect.gitsync.serviceAccountName" . }}
  labels:
    {{- include "mkonnect.gitsync.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
