apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mkonnect.fullname" . }}
  labels:
    {{- include "mkonnect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mkonnect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mkonnect.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      serviceAccountName: {{ include "mkonnect.serviceAccountName" . }}
      containers:
        - name: mkonnect
          image: "{{ required "image.repository is required — set it to your published registry (e.g. public.ecr.aws/<alias>/memento-connector)" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "mkonnect.fullname" . }}-config
          env:
            - name: PROTOCOL_VERSION
              value: {{ .Values.config.protocolVersion | quote }}
            - name: KEY_FILE
              value: {{ .Values.config.keyFile | quote }}
            {{- if .Values.credentials.secretName }}
            - name: CREDS_FILE
              value: {{ printf "/etc/mkonnect/%s" (required "credentials.key is required when credentials.secretName is set" .Values.credentials.key) | quote }}
            {{- end }}
            {{- if .Values.caBundle.secretName }}
            - name: CA_BUNDLE
              value: {{ printf "%s/%s" (required "caBundle.mountPath is required when caBundle.secretName is set" .Values.caBundle.mountPath) (required "caBundle.key is required when caBundle.secretName is set" .Values.caBundle.key) | quote }}
            {{- end }}
            {{- range $plugin, $url := .Values.plugins }}
            - name: PLUGIN_{{ $plugin | upper }}
              value: {{ $url | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.credentials.secretName }}
            - name: credentials
              mountPath: /etc/mkonnect
              readOnly: true
            {{- end }}
            {{- if .Values.caBundle.secretName }}
            - name: ca-bundle
              mountPath: {{ .Values.caBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - /mkonnect
                - --health
            failureThreshold: 3
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mkonnect.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.credentials.secretName }}
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.secretName | quote }}
            # 0440 (r--r-----): Kubernetes mounts the Secret owned by root with
            # group = the pod's fsGroup (65532), so the non-root connector reads
            # it through the group bit. The connector accepts owner+group-read
            # but rejects any world access, so do not widen this.
            defaultMode: 0440
            items:
              - key: {{ required "credentials.key is required when credentials.secretName is set" .Values.credentials.key | quote }}
                path: {{ .Values.credentials.key | quote }}
        {{- end }}
        {{- if .Values.caBundle.secretName }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caBundle.secretName | quote }}
            # 0444 (r--r--r--): CA certificates are public, non-secret data, so unlike
            # the credentials mount (0440) no access restriction is needed. The
            # connector only reads the bundle.
            defaultMode: 0444
            items:
              - key: {{ required "caBundle.key is required when caBundle.secretName is set" .Values.caBundle.key | quote }}
                path: {{ .Values.caBundle.key | quote }}
        {{- end }}
