{{- /*
Chart-managed registration token Secret. Only created when a token value is supplied and no
existing Secret is referenced; the preferred route is gitSync.config.registrationTokenSecret.
*/ -}}
{{- if and .Values.gitSync.enabled .Values.gitSync.config.registrationToken (not .Values.gitSync.config.registrationTokenSecret.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkonnect.gitsync.fullname" . }}-registration
  labels:
    {{- include "mkonnect.gitsync.labels" . | nindent 4 }}
type: Opaque
data:
  registration-token: {{ .Values.gitSync.config.registrationToken | b64enc | quote }}
{{- end }}
