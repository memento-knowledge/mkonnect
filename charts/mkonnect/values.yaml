replicaCount: 1

image:
  # required: set to the published connector registry, e.g. public.ecr.aws/h2a8k0r3/memento-connector
  repository: ""
  pullPolicy: IfNotPresent
  # Set an explicit stable release ID in production. Defaults to Chart.appVersion.
  tag: ""

config:
  gatewayUrl: ""           # required: wss://<customer-slug>.bridge.memento-platform.com/ws
  connectorId: ""          # required: UUID of this connector
  protocolVersion: "v1"
  keyFile: "/data/key"     # path inside container for ML-DSA-65 private key

# PLUGIN_* env vars for on-prem services
# Example: jenkins: "http://jenkins:8080"
plugins: {}

# Optionally mount a pre-created Secret as the connector's read-only credential
# store, instead of writing it at runtime with `connector config set`. This is
# the recommended way to manage tool credentials on Kubernetes: the plaintext
# lives only in a Secret you control (and can source from Vault, the External
# Secrets Operator, etc.), never in this values file.
#
# The Secret must hold the credentials JSON under the key named below. Its
# format matches the file `connector config set` writes:
#   { "jenkins": { "base_url": "http://jenkins:8080", "auth": "basic",
#                  "username": "<user>", "token": "<api-token>" } }
# When secretName is set, the connector reads this file and does not accept
# `connector config set` (the mount is read-only).
credentials:
  secretName: ""              # name of an existing Secret; empty disables the mount
  key: "credentials.json"     # key within that Secret holding the credentials JSON

# Optionally mount a Secret holding a PEM bundle of additional root CA(s) to trust
# for upstream plugin TLS — e.g. an internal CA that signs a self-managed service's
# certificate. The connector ADDS these to the system trust store; it never disables
# verification. The bundle is mounted read-only at mountPath/<key>.
#
# When secretName is set, the connector trusts the bundle for ALL plugins by default
# (it sets CA_BUNDLE to the mounted file). A single plugin can instead point at a
# different bundle with the per-plugin `ca_bundle` field in the credentials JSON, set
# to an absolute path such as "<mountPath>/<key>".
#
# mountPath is a sibling of the credentials mount (not nested under it), so the two
# Secret mounts do not overlap.
caBundle:
  secretName: ""              # name of an existing Secret holding the PEM bundle; empty disables
  key: "ca-bundle.pem"        # key within that Secret holding the PEM bundle
  mountPath: "/etc/mkonnect-ca"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
